<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VulnParser — Vulnerability Scanner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Syne', sans-serif;
      background: #0a0c0f;
      color: #e8eaf0;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
      position: relative;
    }

    /* Header */
    .header {
      margin-bottom: 40px;
    }

    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 4px;
      color: #00e5ff;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .logo span { color: #6b7280; }

    h1 {
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 800;
      line-height: 1.1;
    }

    h1 em {
      font-style: normal;
      color: #00e5ff;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 14px;
      color: #6b7280;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Form */
    .scan-form {
      background: #111318;
      border: 1px solid #22262f;
      border-radius: 6px;
      padding: 28px;
      margin-bottom: 28px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 200px;
    }

    label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #6b7280;
      text-transform: uppercase;
    }

    input, select {
      padding: 12px 14px;
      background: #0a0c0f;
      border: 1px solid #22262f;
      border-radius: 4px;
      color: #e8eaf0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    input::placeholder { color: #3d424f; }

    input:focus, select:focus {
      border-color: rgba(0,229,255,0.4);
    }

    select option { background: #111318; }

    .btn-scan {
      padding: 12px 28px;
      background: #00e5ff;
      color: #0a0c0f;
      border: none;
      border-radius: 4px;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      align-self: flex-end;
      white-space: nowrap;
    }

    .btn-scan:hover { background: #00b8cc; }
    .btn-scan:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Status bar */
    .status-bar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(0,229,255,0.05);
      border: 1px solid rgba(0,229,255,0.15);
      border-radius: 4px;
      margin-bottom: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #00e5ff;
    }

    .status-bar.error {
      background: rgba(255,71,71,0.05);
      border-color: rgba(255,71,71,0.2);
      color: #ff4747;
    }

    .status-bar.visible { display: flex; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(0,229,255,0.2);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Report area */
    .report-container {
      display: none;
      background: #111318;
      border: 1px solid #22262f;
      border-radius: 6px;
      overflow: hidden;
    }

    .report-container.visible { display: block; }

    .report-header {
      padding: 14px 20px;
      background: #1a1d24;
      border-bottom: 1px solid #22262f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #6b7280;
    }

    .report-header strong { color: #00e5ff; }

    .report-iframe {
      width: 100%;
      height: 700px;
      border: none;
      display: block;
    }

    .report-text {
      padding: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #00ff66;
      background: #0d0d0d;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 600px;
      overflow-y: auto;
      line-height: 1.6;
    }

    /* Scan type info chips */
    .scan-types {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 4px 12px;
      border: 1px solid #22262f;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #6b7280;
    }

    .chip strong { color: #00e5ff; }

    @media (max-width: 600px) {
      .form-row { flex-direction: column; }
      .btn-scan { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="logo">Vuln<span>Parser</span> // v2.0</div>
    <h1>Automated <em>Vulnerability</em><br>Scanner</h1>
    <div class="subtitle">// Port scan · Subdomain enum · XSS detection · JS analysis · Header audit</div>
  </div>

  <div class="scan-form">
    <div class="form-row">
      <div class="form-group" style="flex:2;">
        <label>Target URL or Domain</label>
        <input id="target" placeholder="demo.testfire.net" />
      </div>
      <div class="form-group">
        <label>Scan Type</label>
        <select id="scanType">
          <option value="1">Quick (Ports + Headers)</option>
          <option value="2">XSS Focus</option>
          <option value="3" selected>Full Scan (Everything)</option>
        </select>
      </div>
      <button class="btn-scan" onclick="startScan()" id="scanBtn">▶ Start Scan</button>
    </div>
    <div class="scan-types">
      <div class="chip"><strong>Quick</strong> — nmap + security headers</div>
      <div class="chip"><strong>XSS</strong> — payload testing + JS analysis</div>
      <div class="chip"><strong>Full</strong> — everything + XSStrike deep scan</div>
    </div>
  </div>

  <div class="status-bar" id="statusBar">
    <div class="spinner" id="spinner"></div>
    <span id="statusMsg">Initializing scan...</span>
  </div>

  <div class="report-container" id="reportContainer">
    <div class="report-header">
      <span>Scan Results</span>
      <strong id="reportLabel">—</strong>
    </div>
    <iframe class="report-iframe" id="reportFrame" style="display:none;"></iframe>
    <div class="report-text" id="reportText" style="display:none;"></div>
  </div>

</div>

<script>
  const SCAN_LABELS = { "1": "Quick Scan", "2": "XSS Scan", "3": "Full Scan" };

  const messages = [
    "Running port scan...",
    "Enumerating subdomains...",
    "Collecting URLs...",
    "Analyzing JavaScript files...",
    "Testing XSS payloads...",
    "Checking security headers...",
    "Running XSStrike...",
    "Generating report..."
  ];

  let msgInterval = null;

  function cycleMessages() {
    let i = 0;
    msgInterval = setInterval(() => {
      document.getElementById("statusMsg").textContent = messages[i % messages.length];
      i++;
    }, 4000);
  }

  function setStatus(msg, isError = false) {
    const bar = document.getElementById("statusBar");
    const spinner = document.getElementById("spinner");
    bar.classList.add("visible");
    bar.classList.toggle("error", isError);
    spinner.style.display = isError ? "none" : "block";
    document.getElementById("statusMsg").textContent = msg;
  }

  function hideStatus() {
    document.getElementById("statusBar").classList.remove("visible");
    if (msgInterval) { clearInterval(msgInterval); msgInterval = null; }
  }

  function startScan() {
    const target = document.getElementById("target").value.trim();
    const scanType = document.getElementById("scanType").value;
    const btn = document.getElementById("scanBtn");
    const reportContainer = document.getElementById("reportContainer");
    const reportFrame = document.getElementById("reportFrame");
    const reportText = document.getElementById("reportText");
    const reportLabel = document.getElementById("reportLabel");

    if (!target) {
      setStatus("❌ Please enter a target domain or URL", true);
      return;
    }

    // Reset UI
    btn.disabled = true;
    btn.textContent = "⏳ Scanning...";
    reportContainer.classList.remove("visible");
    reportFrame.style.display = "none";
    reportText.style.display = "none";

    setStatus("Initializing scan...");
    cycleMessages();

    fetch("/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ target, scanType })
    })
    .then(res => res.json())
    .then(data => {
      hideStatus();
      btn.disabled = false;
      btn.textContent = "▶ Start Scan";

      if (data.error) {
        setStatus("❌ " + data.error, true);
        return;
      }

      reportLabel.textContent = `${SCAN_LABELS[scanType]} — ${target}`;
      reportContainer.classList.add("visible");

      if (data.htmlReport) {
        // Show HTML report in iframe via blob URL
        const blob = new Blob([data.htmlReport], { type: "text/html" });
        const url = URL.createObjectURL(blob);
        reportFrame.src = url;
        reportFrame.style.display = "block";
        reportText.style.display = "none";
      } else if (data.textReport) {
        reportText.textContent = data.textReport;
        reportText.style.display = "block";
        reportFrame.style.display = "none";
      }
    })
    .catch(err => {
      hideStatus();
      btn.disabled = false;
      btn.textContent = "▶ Start Scan";
      setStatus("❌ Cannot connect to backend. Is the server running on port 5000?", true);
    });
  }

  // Allow Enter key to trigger scan
  document.getElementById("target").addEventListener("keydown", e => {
    if (e.key === "Enter") startScan();
  });
</script>

</body>
</html>
